# Wildfire ConvLSTM U-Net default experiment config.
# This file is intentionally verbose so it can also serve as an ablation reference.
# Parameter values are unchanged; comments list the supported options or valid ranges.

# Main dataset directories used for training/validation/test in multi-dataset mode.
# Options: a non-empty list of relative or absolute directory paths containing one .npy file per timestamp.

paths:
  project_root: /home/mhabibp/fire_forecasting
  raw_data_root: /project/fafghah/iswinlab/CAWFE_MOBIN/New_CAWFE
  scratch_root: /scratch/mhabibp
  dataset_root: ${paths.scratch_root}/fire_forecasting_datasets/
  patch_cache_root: ${paths.scratch_root}/fire_forecasting_patch_cache
  normalization_root: ${paths.patch_cache_root}
  artifacts_root: artifacts
  runs_root: ${paths.artifacts_root}/runs
  results_root: ${paths.artifacts_root}/results
  logs_root: ${paths.artifacts_root}/logs

# main_data_dir: /media/mhabibp/Elements/Mobin_CPS_files/New_CAWFE/
main_data_dir: ${paths.raw_data_root}

# Use ../fire_dataset_index_trimmed.json here after running scripts/manual_trim_fire_datasets.py.
# The trimmed index stores compact temporal_trim start/end indices, not long frame-path lists.
# Keep this pointed at ../fire_dataset_index.json until you intentionally switch to manual trims.
# Rebuild patch cache and normalization stats after switching indexes.
fire_dataset_index_json: ../fire_dataset_index_trimmed.json

data_dirs: []

data_discovery:
  mode: fire_index
  fire_dir_glob: "*"
  require_npy_files: true
  file_pattern: "*.npy"
  require_geom: true
  require_terrain: false
  recursive: true
  update_fire_index_before_training: false

# Legacy single dataset directory fallback.
# Options: any relative or absolute directory path containing one .npy file per timestamp.
# If data_dirs exists and is non-empty, code uses data_dirs and ignores this fallback.
data_dir: null

# External final-test dataset directory.
# Options: null to disable external testing, or any relative/absolute directory path.
test_data_dir: null

# Glob pattern for the main dataset files.
# Options: any glob accepted by pathlib.Path.glob, e.g. "*.npy", "frame_*.npy".
file_pattern: "*.npy"

# Glob pattern for external test files.
# Options: any glob; if omitted in other configs, code falls back to file_pattern.
external_test_file_pattern: "*.npy"

# Number of historical frames fed into the model.
# Options: any positive integer >= 1.
input_sequence_length: 5

# Forecast horizon in frames after the last input timestep.
# Options: any integer >= 0.
prediction_horizon: 10

data:
  # Mirrors fire_dataset_index_json for documentation-oriented tools.
  # Use fire_dataset_index_trimmed.json after running scripts/manual_trim_fire_datasets.py.
  fire_dataset_index: fire_dataset_index_trimmed.json
  input_sequence_length: 5
  prediction_horizon: 10

terrain:
  enabled: true
  required: true
  copy_original_file: true
  parser:
    format: cawfe_terrain
  features:
    output_channels: 4
    channels: [relative_elevation, slope_magnitude, slope_x, slope_y]
    elevation_normalization: zscore
    slope_magnitude_normalization: log1p_minmax
    slope_xy_normalization: p99_abs_clip
    slope_xy_clip_value: 1.0
  quicklook:
    enabled: true

processed_dataset:
  enabled: true
  version: cawfe_engineered_v1
  root: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1
  save_raw_channels: true
  save_engineered_channels: true
  save_area_2d: true
  save_quicklooks: true
  frame_format: npz
  compression: compressed
  dtype: float32
  overwrite: false
  skip_existing: true
  quicklook:
    enabled: true
    every_n_frames: 100
    max_per_fire: 20
  patch_index:
    enabled: true
    patch_size: 64
    stride: 60
    include_border_patches: true
    min_valid_fraction: 0.0

sequence:
  input_sequence_length: 5
  prediction_horizon: 10

target_construction:
  enabled: true
  output_root: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/targets
  horizon: 10
  current_frame_reference: last_input
  threshold_estimation:
    enabled: true
    fit_split: train
    percentile: 1.0
    positive_only: true
    min_positive_value:
      energy_release_mw: 0.0
      surface_consumed: 0.0
      canopy_consumed: 0.0
    max_samples_per_quantity: null
    # Optional speed control: randomly process at most this many current/future
    # frame pairs per train fire. null scans every valid pair.
    max_frame_pairs_per_fire: null
    output_dir: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/thresholds
    output_path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/thresholds/fire_mask_thresholds_latest.json
    update_config: false
    derived_config_path: configs/derived/default_with_fire_mask_thresholds.yaml
  fire_mask:
    method: threshold_union
    energy_threshold_mw: null
    surface_fuel_threshold: null
    canopy_fuel_threshold: null
    threshold_file: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/thresholds/fire_mask_thresholds_latest.json
    require_frozen_thresholds: true
    save_dtype: bool
  consumed_fuel:
    clip_negative: true
    clip_to_available_fuel: true
  energy:
    save_mw: true
    save_log1p: true
    use_area_2d: true

temporal_sampling:
  horizon: 10
  sample_patterns:
    consecutive5_h10:
      enabled: true
      input_offsets: [-4, -3, -2, -1, 0]
      horizon: 10
    single1_h10:
      enabled: true
      input_offsets: [0]
      horizon: 10
    sparse5_h10:
      enabled: true
      input_offsets: [-40, -30, -20, -10, 0]
      horizon: 10
  default_pattern: consecutive5_h10

normalization:
  enabled: true
  output_dir: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization
  stats_path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization/latest_normalization.json
  npz_path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization/latest_normalization.npz
  fit_split: train
  apply_to_splits: [train, val, test]
  compute_from: dynamic_patches
  sample_pattern: consecutive5_h10
  patch_index: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/indices/patches/patches_64_stride60_border.jsonl
  max_samples: null
  eps: 1.0e-6

dataloader:
  source: processed_full_frames
  sample_pattern: consecutive5_h10
  patch_size: 64
  normalize_inputs: true
  single_frame_mode: as_is
  return_terrain: auto
  target_root: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/targets
  return_metadata: false

# Legacy single-target channel index used by regression/segmentation utilities.
# Options: any valid raw channel index in [0, C_raw - 1].
# In multitask mode this is mostly for backward-compatible scripts.
target_channel: 84

# Dataset split policy.
# Supported options:
# - multi_fire_chronological: split each fire independently by time, then concatenate train/val/test samples
# - manual_fire_holdout: user manually assigns whole fires to train/val/test
# - train_val_external_test: main data_dir -> chronological train/val only, test_data_dir used for final testing
# - train_val_test: legacy chronological train/val/test split within data_dir
split_mode: manual_fire_holdout

fire_filter:
  # Optional include/exclude lists for multi_fire_chronological mode.
  # If include_fires is non-empty, only those fires are used before exclude_fires is applied.
  include_fires: []
  exclude_fires: []

manual_fire_split:
  enabled: true

  # Fire names must match keys in fire_dataset_index.json.
  # These defaults are examples and should be updated to match the fires currently available in your mounted dataset tree.
  # train_fires:
  #   - ARCHIECREEK
  #   - CALWOOD  wind driven
  #   - CAMP wind driven
  #   - CARR_FIRENADO
  #   - CARR_GROWTHDAY
  #   - CHIMNEYTOPS2 wind driven
  #   - CREEK
  #   - ESPERANZA
  #   - KING__period1__keepz_08
  #   - KING__period2__keepz_08
  #   - KING__period3__keepz_08
  #   - MARSHALL  wind driven
  #   - MOSQUITO
  #   - NORTHCOMPLX
  #   - RIM__0820__keepz_08
  #   - RIM__0822__keepz_08
  #   - SLATER
  #   - THOMAS__1204__keepz_08
  #   - THOMAS__1208__keepz_08
  #   - THOMAS__1209__keepz_08
  #   - THOMAS__1210__keepz_08
  #   - REDWOODVALLEY  wind driven
  #   - GLASS
  #   - LITTLEBEAR__lbvaa__keepz_08
  #   - LITTLEBEAR__lbvab__keepz_08
  #   - LITTLEBEAR__lbvac__keepz_08 wind driven

  # val_fires:
  #   - EASTTROUBLESOME
  #   - PARKCTY_HYPOTHETICAL
  #   - Tubbs  wind driven
  #   - WITCHCREEK 

  # test_fires:
  #   - MCKINNEY
  #   - TRUCKEE_HYPOTHETICAL
  #   - TUOLUMNE_65
  #   - WOOLSEY
  #   - SPRINGS
  #   - YUBA_HYPOTHETICAL

  train_fires:
    - THOMAS__1204__keepz_08
    - THOMAS__1208__keepz_08
    - CALWOOD
    - Tubbs
    - REDWOODVALLEY

  val_fires:
    - THOMAS__1209__keepz_08
    - WITCHCREEK 
    - MARSHALL

  test_fires:
    - THOMAS__1210__keepz_08
    - CHIMNEYTOPS2




  use_full_fire_for_split: true
  within_fire_train_fraction: 1.0
  within_fire_val_fraction: 1.0
  within_fire_test_fraction: 1.0

  require_all_listed_fires_exist: true
  disallow_overlap_between_splits: true
  require_nonempty_train: true
  require_nonempty_val: true
  require_nonempty_test: true
  save_resolved_split_json: true
  resolved_split_json: artifacts/splits/manual_fire_split_resolved.json
  fraction_warning_tolerance: 0.20

temporal_trim:
  # Manual pre-fire trimming workflow:
  # 1) choose fire start/end frames with scripts/manual_trim_fire_datasets.py
  # 2) write compact temporal_trim metadata to fire_dataset_index_trimmed.json
  # 3) point fire_dataset_index_json at ../fire_dataset_index_trimmed.json and rebuild cache/stats
  enabled: true
  mode: manual
  trim_config: configs/manual_fire_trim.json
  trimmed_index: fire_dataset_index_trimmed.json

# Learning task.
# Supported options:
# - regression
# - segmentation
# - multitask
task_type: multitask

# Threshold used by several regression/segmentation utilities when turning scalar maps into active masks.
# Options: any float threshold appropriate for the chosen target variable.
fire_threshold: 0.5

cache:
  enabled: true
  scratch_root: ${paths.scratch_root}
  cache_dir: ${paths.patch_cache_root}
  cache_version: v5_manual_trim_T5_H10_stride60
  input_sequence_length: 5
  prediction_horizon: 10
  target_definition_version: interval_consumed_current_to_horizon_target_v1
  use_precomputed_patches: true
  allow_dynamic_fallback: false
  validate_cache_before_training: true
  overwrite_existing: false
  allow_config_hash_mismatch: false
  train_patch_mode: sliding_window
  val_patch_mode: sliding_window
  test_patch_mode: sliding_window
  train_stride: 60
  val_stride: 60
  test_stride: 60
  preferred_format: npz
  shard_format: npz
  samples_per_shard: 512
  compressed: false
  benchmark_cache_on_start: false
  save_metadata: true
  save_preview_images: true
  num_preview_images: 50
  save_normalized_inputs: false
  # Cached training batch order. shard_local keeps batches sequential within
  # each shard for faster smoke tests on network-backed scratch storage.
  # Options: weighted_random, shard_local_shuffle, shard_local
  train_batch_sampler: shard_local
  shard_memory_cache_size: 2

patching:
  enabled: true
  input_sequence_length: 5
  prediction_horizon: 10
  patch_size: 64
  patch_height: 64
  patch_width: 64
  allow_padding_small_domains: false
  pad_value_normalized: 0.0
  train_patch_mode: sliding_window
  val_patch_mode: sliding_window
  test_patch_mode: sliding_window
  train_stride: 60
  val_stride: 60
  test_stride: 60
  train_sampling_mode: sliding_window
  active_patch_probability: 0.0
  random_patch_probability: 1.0
  active_source: combined_target
  consumed_active_threshold: 0.001
  energy_active_threshold_MW: 0.001
  min_active_pixels: 5
  center_on_active_pixel: true
  jitter_active_center: true
  max_center_jitter_pixels: 16
  eval_mode: sliding_window
  eval_patch_size: 64
  eval_stride: 60
  include_border_patches: true
  tiled_inference:
    enabled: true
    tile_size: 64
    tile_stride: 60
    blend_mode: average
    return_full_domain_maps: true
  require_patch_divisible_by: 16
  auto_pad_to_divisible: false

# Backward-compatible top-level patch flags used by older scripts.
use_patches: true
use_patches_for_eval: true
patch_size: 64
active_patch_probability: 0.4
active_threshold: 0.001

# Chronological train fraction for the main dataset.
# Options:
# - for split_mode=train_val_external_test: train_fraction + val_fraction must sum to 1.0
# - for split_mode=train_val_test or multi_fire_chronological: train_fraction + val_fraction + test_fraction must sum to 1.0
train_fraction: 0.7

# Chronological validation fraction for the main dataset.
# Options: see train_fraction rules above.
val_fraction: 0.15

# Chronological internal test fraction.
# Options:
# - 0.0 when using train_val_external_test
# - positive fraction when using train_val_test or multi_dataset_chronological
test_fraction: 0.15

# Whether dataset metadata should include dataset_id and dataset_name when return_metadata=True.
# Options: true, false
dataset_id_in_metadata: true

dataset_sampling:
  # Enable custom train sampling across datasets.
  # Options: true, false
  enabled: true

  # Dataset sampling strategy.
  # Supported options:
  # - uniform_samples
  # - balanced_by_fire
  mode: balanced_by_fire

# Batch size for DataLoaders. Keep this aligned with cache.samples_per_shard
# for smoke tests so validation batches do not repeatedly cross shard files.
# Options: any positive integer >= 1, limited by memory.
batch_size: 128

# Top-level learning rate fallback.
# Options: any positive float > 0.
# training.learning_rate would override this if added later.
learning_rate: 0.0001

# Total training epochs.
# Options: any positive integer >= 1.
epochs: 50

# Number of DataLoader workers.
# Options: any integer >= 0.
num_workers: 2

# Device selection.
# Supported options in code:
# - auto
# - cpu
# - cuda
# - gpu   # alias for cuda
device: cuda

# External test spatial handling policy.
# Supported options:
# - direct: feed native external-test H/W directly to the model
# - pad_to_train_size: pad to train_height/train_width, run inference, crop back to native H/W
# - pad_to_multiple: pad to the next multiple of pad_multiple, run inference, crop back
# - auto: try direct first, then pad_to_multiple, then pad_to_train_size
external_test_spatial:
  mode: auto

  # Training spatial size reference used by pad_to_train_size.
  # Options: any positive integers >= 1.
  train_height: 144
  train_width: 144

  # Multiple used by pad_to_multiple.
  # Options: any positive integer >= 1.
  pad_multiple: 16

  # Padding value for normalized model inputs.
  # Options: any float. 0.0 is the natural default for z-score normalized inputs.
  pad_value_normalized: 0.0

  # Crop model outputs back to the original native-grid H/W after padded inference.
  # Options: true, false
  crop_output_to_original_size: true

  # Resize-based inference is intentionally not used by default because it changes physical scale.
  # Options: true, false
  allow_resize: false

rollout:
  # Enable autoregressive rollout evaluation utilities.
  # Options: true, false
  enabled: true

  # Number of autoregressive forecast steps.
  # Options: any positive integer >= 1.
  rollout_steps: 20

  # Window handling policy for rollout inference.
  # Supported options:
  # - static
  window_mode: static

  # How non-fuel future inputs are filled during rollout.
  # Supported options:
  # - teacher_forced: use the true future raw frame for non-fuel channels, but replace fuel with predicted fuel
  # - constant: copy the previous rollout raw frame and replace fuel with predicted fuel
  exogenous_mode: teacher_forced

  # Raw fuel channels updated during rollout.
  # Options: any valid raw channel indices.
  surface_fuel_channel: 84
  canopy_fuel_channel: 85

  # Clamp reconstructed future fuel maps to be nonnegative.
  # Options: true, false
  clamp_fuel_nonnegative: true

  # Probability threshold used to binarize the mask-logit head during rollout visualization and metrics.
  # Options: any float in [0, 1].
  mask_probability_threshold: 0.5

  # Save one rollout GIF per selected sample.
  # Options: true, false
  save_gif: true

  # Save per-step PNG frames alongside the GIF.
  # Options: true, false
  save_png_frames: false

  # GIF frames per second.
  # Options: any positive integer >= 1.
  fps: 2

  # Random seed used when rollout samples are selected randomly.
  # Options: any integer.
  random_seed: 42

  # Root output directory for rollout artifacts.
  # Options: any relative or absolute path.
  output_dir: ./outputs/rollouts

# Number of raw/base channels to take before adding engineered channels.
# Options: any integer in [1, C_raw].
input_channel_count: 86

# Explicit base input channel list.
# Options:
# - null: use channels [0, 1, ..., input_channel_count - 1]
# - explicit list of valid raw channel indices
input_channel_indices: null

channel_layout:
  # Informational atmospheric channel span.
  # Options: any inclusive [start, end] pair describing where atmospheric channels live.
  atmospheric_channels: [0, 79]

  # Raw flux channel indices used by engineered features and some masks.
  # Options: any valid list of raw channel indices.
  flux_channels: [80, 81, 82, 83]

  # Raw fuel channel indices used by engineered features and multitask targets.
  # Options: any valid list of exactly two raw channel indices [surface, canopy].
  fuel_channels: [84, 85]

  # Raw surface fuel channel index.
  # Options: any valid raw channel index; defaults to fuel_channels[0] if omitted.
  surface_fuel_channel: 84

  # Raw canopy fuel channel index.
  # Options: any valid raw channel index; defaults to fuel_channels[1] if omitted.
  canopy_fuel_channel: 85

  # Raw flux channel used to derive active-fire masks in active_flux mode.
  # Options: any valid raw channel index; defaults to flux_channels[0] if omitted.
  flux_mask_channel: 80

engineered_features:
  # Master switch for fuel/flux engineered features.
  # Options: true, false
  enabled: true

  # Append current_flux - previous_flux for each configured flux channel.
  # Options: true, false
  add_flux_delta: true

  # Append current_fuel - previous_fuel for each configured fuel channel.
  # Options: true, false
  add_fuel_delta: true

  # Append previous_fuel - current_fuel for each configured fuel channel.
  # Options: true, false
  add_step_consumed_fuel: true

  # Append initial_fuel - current_fuel for each configured fuel channel.
  # Options: true, false
  add_cumulative_consumed_fuel: true

  # Initial-fuel reference strategy.
  # Currently implemented options:
  # - first_dataset_frame
  initial_fuel_mode: first_dataset_frame

  # Clamp step/cumulative consumed-fuel engineered inputs to be nonnegative.
  # Options: true, false
  clamp_consumed_fuel_nonnegative: true

atmospheric_features:
  # Master switch for atmospheric engineered features.
  # Options: true, false
  enabled: true

  # Number of retained z-levels.
  # Options: any positive integer >= 1, as long as num_vertical_levels * variables_per_level <= raw channel count.
  num_vertical_levels: 8

  # Number of atmospheric variables per z-level.
  # Options: any positive integer >= 1.
  variables_per_level: 10

  # Append sqrt(U^2 + V^2 + epsilon) for every retained z-level.
  # Options: true, false
  add_horizontal_wind_speed: true

  # Append one low-level mean wind-speed channel.
  # Options: true, false
  add_low_level_mean_wind_speed: true

  # Append max(W, 0) for every retained z-level.
  # Options: true, false
  add_updraft: true

  # Append wind direction using normalized U/V unit-vector components for every retained z-level.
  # Options: true, false
  add_wind_direction: true

  # Wind-direction feature encoding mode.
  # Currently implemented options:
  # - unit_vector
  wind_direction_mode: unit_vector

  # Wind-direction convention.
  # Currently implemented options:
  # - toward
  wind_direction_convention: toward

  # Z-level indices used for the low-level mean wind feature.
  # Options: any non-empty list of valid zero-based z-level indices in [0, num_vertical_levels - 1].
  low_level_indices: [0, 1, 2]

  # Small positive constant used in sqrt computations for wind speed.
  # Options: any float >= 0.
  epsilon: 1.0e-06

multitask:
  # Multitask output mode.
  # Currently implemented options:
  # - surface_canopy_consumed_plus_mask
  output_mode: surface_canopy_consumed_plus_mask

  # Output/label channel mapping follows:
  # y[:, 0] = surface consumed fuel
  # y[:, 1] = canopy consumed fuel
  # y[:, 2] = binary mask target
  # y[:, 3] = log1p energy release total MW
  output_channels:
    surface_consumed: 0
    canopy_consumed: 1
    mask_logits: 2
    energy_total_log1p: 3

  # Raw surface fuel channel used to build multitask regression targets.
  # Options: any valid raw channel index.
  surface_fuel_channel: 84

  # Raw canopy fuel channel used to build multitask regression targets.
  # Options: any valid raw channel index.
  canopy_fuel_channel: 85

  # Raw flux channel used to build the active_flux mask target.
  # Options: any valid raw channel index.
  flux_mask_channel: 80

  # Binary mask target definition.
  # Supported options:
  # - active_flux
  # - burned_fuel
  mask_target_type: burned_fuel

  # Threshold for active_flux mask_target_type.
  # Options: any float threshold in the selected flux channel's range.
  flux_fire_threshold: 0.05

  # Threshold for burned_fuel mask_target_type.
  # Options: any float >= 0.
  consumed_fuel_threshold: 0.01

  # Clamp consumed-fuel regression targets to be nonnegative.
  # Options: true, false
  clamp_consumed_fuel_targets_nonnegative: true

  # Multitask regression loss for channels 0 and 1.
  # Supported options:
  # - weighted_huber
  # - weighted_mse
  # - huber
  # - mse
  regression_loss: weighted_huber

  # Multitask segmentation loss for channel 2 logits.
  # Supported options:
  # - bce_dice
  # - bce_with_logits
  # - dice
  # - focal
  segmentation_loss: bce_dice

  # Weight for surface regression loss in total multitask loss.
  # Options: any nonnegative float.
  surface_loss_weight: 1.0

  # Weight for canopy regression loss in total multitask loss.
  # Options: any nonnegative float.
  canopy_loss_weight: 1.0

  # Weight for segmentation loss in total multitask loss.
  # Options: any nonnegative float.
  segmentation_loss_weight: 5.0

  # Weight for the energy release regression head.
  # Options: any nonnegative float.
  energy_loss_weight: 1.0

  # Weight applied to active pixels in weighted multitask losses.
  # Options: any positive float > 0.
  active_fire_weight: 20.0

  # Weight applied to background pixels in weighted multitask losses.
  # Options: any positive float > 0.
  background_weight: 1.0

  # Loss for the energy release map head.
  # Supported options:
  # - huber
  # - mse
  energy_loss: huber

  # Target space used by the energy loss.
  # Currently implemented options:
  # - log
  energy_loss_space: log

  # Active/background weights for the energy loss.
  energy_active_weight: 10.0
  energy_background_weight: 1.0

  # Active-energy threshold in physical MW.
  energy_active_threshold_MW: 0.001

energy_release:
  enabled: true
  surface_sensible_flux_channel: 80
  surface_latent_flux_channel: 81
  canopy_sensible_flux_channel: 82
  canopy_latent_flux_channel: 83
  flux_units: W_per_m2
  clamp_negative_flux_to_zero: true
  save_components: true
  add_as_input_history: false
  target_transform: log1p
  inverse_transform: expm1
  predict_total: true
  predict_sensible: false
  predict_latent: false

baselines:
  prediction_horizon: 10

  persistence:
    mask_mode: zero

  linear_extrapolation:
    mask_source: predicted_consumed
    consumed_threshold: 0.001

geometry:
  require_geom_file: true
  earth_radius_m: 6371000.0
  use_geom_cos_latitude: false
  geom_cos_tolerance: 1.0e-5
  spacing_tolerance_relative: 1.0e-4
  validate_against_terrain_header: true
  allow_area_transpose_if_needed: false

target_normalization:
  # Whether to normalize target channels.
  # Options: true, false
  # Note: for multitask, only channels 0 and 1 are normalized; the mask and energy targets are not normalized here.
  enabled: false

  # Target normalization method.
  # Currently implemented options:
  # - zscore
  method: zscore

model:
  # Model family.
  # Currently implemented/used here:
  # - convlstm_unet
  # - earthformer_lite
  # - st_mamba_lite
  # - weatherformer_lite
  # - cawfe_latte (v1 end-to-end: encoders, fusion, temporal CNN, decoder, heads)
  architecture: convlstm_unet
  name: convlstm_unet
  input_sequence_length: 5

  # Total input channels after all enabled engineered features are appended.
  # Options: any positive integer matching the actual dataset tensor width after engineering.
  # Default full setup here:
  # 86 raw + 10 fuel/flux engineered + 33 atmospheric engineered = 129
  input_channels: 129

  # ConvLSTM hidden dimension.
  # Options: any positive integer >= 1.
  hidden_dim: 64

  # ConvLSTM kernel size.
  # Options: any positive integer >= 1.
  kernel_size: 3

  # Number of ConvLSTM layers.
  # Options: any positive integer >= 1.
  num_layers: 1

  # Dropout probability in the model.
  # Options: float in [0, 1).
  dropout: 0.0

  # Output channels.
  # Options: any positive integer >= 1.
  # Common values:
  # - 1 for regression/segmentation
  # - 4 for the default multitask setup with energy release
  output_channels: 4

  # Optional output activation at the model head.
  # Supported options in code:
  # - null
  # - sigmoid
  # - relu
  # Note: multitask mode forces this to null internally.
  output_activation: null

convlstm_unet:
  input_sequence_length: 5
  use_mask_gated_regression: false
  regression_activation: softplus
  mask_gate_source: predicted_mask
  mask_gate_mode: soft
  mask_gate_threshold: 0.0
  detach_mask_gate: false
  mask_gate_min: 0.05
  output_bias_init:
    enabled: true
    regression_bias: -3.0
    mask_bias: -3.0
    energy_bias: -2.0

earthformer_lite:
  input_sequence_length: 5
  patch_size: 64
  embed_dim: 64
  depths: [2, 2]
  num_heads: [4, 8]
  mlp_ratio: 4.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path: 0.1
  attention_pattern: axial
  use_shifted_windows: false
  use_global_vectors: true
  num_global_vectors: 8
  downsample_stages: 2
  patch_merge_factor: 2
  use_time_pos_embed: true
  use_space_pos_embed: true
  temporal_readout: attention_pool
  output_mode: final_step
  output_channels: 4
  gradient_checkpointing: false
  required_patch_divisibility: 16

st_mamba_lite:
  input_sequence_length: 5
  patch_size: 64
  embed_dim: 64
  encoder_channels: [64, 128]
  decoder_channels: [128, 64]
  depths: [2, 2]
  mamba_backend: auto
  d_state: 16
  d_conv: 4
  expand: 2
  scan_mode: route_pair
  scan_routes: [HVT, TVH]
  bidirectional_scan: true
  bidirectional_merge: mean
  route_merge: mean
  use_depthwise_conv3d: true
  depthwise_conv3d_kernel_size: [3, 3, 3]
  use_st_mixer: true
  st_mixer_sequence_order: THW
  temporal_readout: attention_pool
  use_unet_decoder: true
  use_skip_connections: true
  upsample_mode: bilinear
  dropout: 0.0
  drop_path: 0.1
  norm_type: layernorm
  mlp_ratio: 4.0
  use_adaln_conditioning: false
  use_fire_static_embedding: false
  gradient_checkpointing: false
  required_patch_divisibility: 16

cawfe_st_mamba:
  input_sequence_length: 5

weatherformer_lite:
  input_sequence_length: 5
  patch_size: 64
  embed_dim: 64
  encoder_channels: [64, 128]
  decoder_channels: [128, 64]
  depths: [2, 2]
  num_heads: [4, 8]
  mlp_ratio: 4.0
  use_channel_scaler: true
  use_feature_gate: true
  scaler_init: 1.0
  use_time_pos_embed: true
  use_2d_space_pos_embed: true
  use_fourier_space_encoding: true
  attention_type: factorized
  temporal_attention: true
  spatial_attention: window
  window_size: 8
  shifted_window: true
  use_global_tokens: true
  num_global_tokens: 4
  downsample_stages: 2
  patch_merge_factor: 2
  temporal_readout: attention_pool
  use_unet_decoder: true
  use_skip_connections: true
  upsample_mode: bilinear
  dropout: 0.0
  attention_dropout: 0.0
  drop_path: 0.1
  norm_type: layernorm
  gradient_checkpointing: false
  required_patch_divisibility: 16

cawfe_latte:
  enabled: true
  version: v1_end_to_end
  debug_prediction_head: false

  input_channels: 129
  input_sequence_length: 5
  output_channels: 4
  output_dim: 64
  use_terrain_conditioning: true
  terrain_encoder:
    in_channels: 4
    hidden_dim: 32
    out_dim: 64
    activation: gelu
    norm: groupnorm
  terrain_film:
    dim: 64
    use_scale: true
    use_shift: true
    scale_init_zero: true
    shift_init_zero: true

  alignment:
    enabled: true
    spatial:
      enabled: true
      assert_same_grid: true
      flatten_order: row_major
      add_positional_embedding: true
      learned_positional_embedding: true
    distribution:
      enabled: true
      norm_type: layernorm
      separate_norm_per_modality: true
      eps: 1.0e-5
    temporal:
      enabled: true
      max_time: 16
      add_positional_embedding: true
      learned_positional_embedding: true
      shared_across_modalities: true

  atmosphere:
    out_dim: 64
    num_levels: 8
    vars_per_level: 10
    hidden_dim: 64
    num_blocks: 2
    vertical_mixing: attention

  wind:
    out_dim: 64
    hidden_dim: 64
    num_blocks: 2
    u_var_index: 0
    v_var_index: 1
    w_var_index: 2
    use_engineered_wind_channels: true
    engineered_channel_keywords:
      - wind
      - speed
      - direction
      - dir_cos
      - dir_sin
      - updraft

  fire_fuel:
    out_dim: 64
    hidden_dim: 64
    num_blocks: 4
    raw_fuel_channels: [84, 85]
    engineered_channel_keywords:
      - fuel_delta
      - step_consumed
      - cumulative_consumed
      - consumed
      - active
      - fire

  flux_energy:
    out_dim: 64
    hidden_dim: 64
    num_blocks: 2
    raw_flux_channels: [80, 81, 82, 83]
    engineered_channel_keywords:
      - flux
      - heat
      - energy

  fusion:
    input_format: tokens
    dim: 64
    num_heads: 4
    dropout: 0.1
    use_layer_norm: true
    residual: true
    query_source: fire_fuel
    key_value_sources:
      - atmosphere
      - wind
      - flux_energy

  backbone:
    type: temporal_cnn
    dim: 64
    num_blocks: 3
    temporal_kernel_size: 3
    spatial_kernel_size: 3
    dropout: 0.1
    residual: true
    norm: groupnorm
    activation: silu

  temporal_aggregation:
    mode: last

  decoder:
    type: shallow_cnn
    in_dim: 64
    hidden_dim: 64
    num_blocks: 2
    dropout: 0.1
    norm: groupnorm
    activation: silu

  heads:
    surface:
      activation: none
    canopy:
      activation: none
    mask:
      activation: logits
    energy:
      activation: none

  auxiliary:
    fire_support_head:
      enabled: true
      source: fused_local
      weight: 0.2
      loss: bce_dice
      detach_source: false

architectures:
  available:
    - convlstm_unet
    - earthformer_lite
    - cawfe_st_mamba
    - weatherformer_lite
    - cawfe_latte
    - current_frame_unet
    - temporal_3d_unet
    - convgru_unet
    - attention_convlstm_unet
    - swin_unet
    - fno_2d
    - ufno

normalization:
  # Enable input normalization. Statistics are fit on the train split only and
  # reused unchanged for train/val/test.
  enabled: true

  # Saved normalization-stats files. compute_normalization.py writes
  # timestamped train_normalization_stats_<config>_<timestamp>.json/.npz files
  # and updates these normalization_stats aliases in the patch-cache directory.
  output_dir: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization
  path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization/latest_normalization.json
  stats_path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization/latest_normalization.json
  npz_path: /scratch/mhabibp/cawfe_datasets/cawfe_engineered_v1/normalization/latest_normalization.npz
  fit_split: train
  sample_pattern: consecutive5_h10
  apply_to_splits:
    - train
    - val
    - test
  allow_val_test_fit: false
  require_stats: true

  # Compute normalization from the precomputed train patch cache.
  # Options: true, false
  compute_from_patch_cache: false

  # Normalization sampling mode.
  # Supported options:
  # - full_domain
  # - patch_sampled
  mode: patch_sampled

  # Max number of train samples/patches used when estimating stats.
  max_patches: 5000

  # Minimum normalization contribution target per training fire when manual holdout is used.
  patches_per_fire_min: 100

  # Whether normalization should use the same active/random patching policy as training.
  use_active_patch_sampling: true

  # Input normalization method.
  # Currently implemented options:
  # - zscore
  method: zscore

  # Minimum std floor / epsilon for normalization.
  # Options: any positive float > 0.
  epsilon: 1.0e-06

  # Apply input normalization on the training device when stats are available.
  # Options: cpu, cuda/device/gpu, none
  input_normalization_device: cpu

  # Use in-place CUDA normalization to avoid extra GPU allocations.
  in_place_cuda_normalization: true

  # Guard against applying input normalization once in the Dataset and again on CUDA.
  apply_once_guard: true

  # Legacy target-normalization flag used by older scripts.
  # Options: true, false
  # Prefer target_normalization.enabled for new configs.
  normalize_target: false

checkpoint:
  # Base checkpoint path. Training derives latest/best checkpoint filenames from this stem.
  # Options: any relative or absolute file path.
  path: ./artifacts/checkpoints/convlstm_unet.pt

  # Legacy/intended checkpoint behavior flag.
  # Options: true, false
  # Note: current training code always writes both latest and best checkpoints.
  save_best_only: true

  # Metric name to monitor.
  # Common/expected options: val_loss
  # Note: current training code selects best checkpoint using validation loss directly.
  monitor: val_loss

checkpointing:
  save_every_n_epochs: 1
  save_latest: true
  save_best: true
  async_save: false

data_loader:
  # Split-specific DataLoader performance controls. "auto" resolves from Slurm CPU allocation.
  train:
    num_workers: auto
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
    drop_last: false
    multiprocessing_context: null
  val:
    num_workers: auto
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
    drop_last: false
    multiprocessing_context: null
  test:
    num_workers: auto
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
    drop_last: false
    multiprocessing_context: null

visualization:
  # Output root directory for saved figures.
  # Options: any relative or absolute directory path.
  output_path: ./outputs/visualizations_multitask

  # Matplotlib colormap.
  # Options: any valid matplotlib colormap string, e.g. inferno, viridis, magma, plasma, cividis.
  cmap: inferno

  # Figure DPI.
  # Options: any positive integer >= 1.
  dpi: 150

  # Generic target threshold used by some visualization utilities.
  # Options: any float threshold appropriate for the displayed target.
  target_threshold: 0.5

training:
  # Total training epochs.
  # Options: any positive integer >= 1.
  epochs: 20
  max_epochs: 50

  # Optional CAWFE-Latte post-fusion feature logging. Disabled by default.
  save_fusion_vectors:
    enabled: false
    output_name: fusion_vectors_by_epoch.npy
    sample_source: first_train_batch
    vector_reduce: mean_bt_hw
    save_metadata: true

  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 8
    min_delta: 0.001
    start_epoch: 5
    restore_best_weights: false
    checkpoint_best: true
    save_latest_on_stop: true
    verbose: true
    stop_on_nan: true

  # Optional explicit run name. When null, training creates:
  # <architecture>_<YYYYMMDD_HHMMSS>_slurm<JOBID> or _local<pid>.
  run_name: null

  # Allow writing directly into an existing explicit run directory.
  # When false, existing names get a _v2/_v3 suffix.
  overwrite_run: false

  output:
    root_dir: ${paths.runs_root}
    checkpoint_root: ${paths.artifacts_root}/checkpoints
    log_root: ${paths.logs_root}
    save_compatibility_checkpoints: false
    update_architecture_latest_checkpoint: true
    save_epoch_checkpoints: false
    save_best_checkpoint: true
    save_latest_checkpoint: false
    save_training_curves: true
    save_metric_curves: true
    save_timing_plots: false
    save_resolved_config: false
    save_original_config: false
    save_run_summary: true
    save_hardware_summary: false
    save_cache_manifest_copy: false
    save_normalization_stats_copy: false
    copy_normalization_npz: false

  checkpointing:
    monitor: val_loss
    mode: min
    save_best: true
    save_latest: true
    save_every_n_epochs: null
    keep_last_n_epoch_checkpoints: 3

  loss:
    surface:
      type: huber
      weight: 1.0
      delta: 1.0
    canopy:
      type: huber
      weight: 1.0
      delta: 1.0
    mask:
      type: bce_dice
      weight: 5.0
      bce_weight: 1.0
      dice_weight: 1.0
    energy:
      type: huber
      weight: 1.0
      delta: 1.0
    auxiliary_fire_support:
      enabled: true
      weight: 0.2

    background_suppression:
      enabled: true
      architectures: [convlstm_unet]
      weight: 0.005
      include_surface: true
      include_canopy: true
      include_energy: true
      include_mask_prob: false
      inactive_definition: combined
      consumed_threshold: 0.001
      energy_log_threshold: 0.001
      mask_threshold: 0.5
      reduction: mean

  # Automatically tune batch/accumulation from detected CUDA VRAM and architecture.
  # ConvLSTM-U-Net is light enough to use larger batches than transformer-style models.
  auto_hardware_tuning:
    enabled: false
    max_host_memory_fraction: 0.55
    # Approximate extra host-memory copies from DataLoader collation, pinned-memory
    # staging, normalization temporaries, and framework overhead.
    host_memory_sample_multiplier: 3.0
    architectures:
      convlstm_unet:
        target_effective_batch_size: 512
        batch_size_32gb: 256
        batch_size_40gb: 512
        batch_size_80gb: 1024
        fallback_batch_size: 128

  performance:
    # Precision options: auto, bf16, fp16, fp32.
    # auto chooses bf16 on Ampere/Hopper GPUs when available, otherwise fp16.
    precision: auto
    allow_tf32: true
    cudnn_benchmark: true
    torch_compile: false
    auto_batch_size: false
    auto_batch_probe_batch_size: 8
    auto_batch_max_trials: 12
    # Treat probe batches above this fraction of total GPU memory as unsafe.
    # This leaves headroom for real-batch variability and allocator fragmentation.
    auto_batch_max_memory_fraction: 0.85
    prefetch_to_cuda: false
    non_blocking_transfer: true
    log_timing: true
    timing_log_every_n_batches: 50
    show_progress_bar: true
    progress_log_percent_step: 0
    synchronize_timing: false
    compute_train_metrics_every_batch: false
    cheap_train_metrics_every_n_batches: 100
    compute_val_metrics: true
    max_train_batches_per_epoch: 100

  validation:
    # Validation protocol. Do not mix capped and full validation in one run.
    # Choices:
    # - full_every_epoch
    # - fixed_subset_every_epoch
    mode: fixed_subset_every_epoch
    max_val_batches_per_epoch: 50
    fixed_subset_seed: 42
    fixed_subset_shuffle: false
    use_same_metric_for_checkpointing: true

  # Optimizer choice.
  # Supported options:
  # - adam
  # - adamw
  # - sgd
  optimizer: adamw

  # Optimizer weight decay.
  # Options: any float >= 0.
  weight_decay: 0.0

  # Gradient clipping norm.
  # Options:
  # - positive float to enable clipping
  # - 0 / 0.0 / null to disable clipping
  gradient_clip_norm: 1.0

  # Enable automatic mixed precision during training.
  # Options: true, false
  # Only has effect on CUDA devices.
  mixed_precision: true

  # Run input normalization after the batch is moved to the training device.
  # This avoids per-sample CPU normalization in DataLoader workers.
  # Options: cpu, cuda/device/gpu, none
  input_normalization_device: cpu

  # Number of micro-batches to accumulate before each optimizer step.
  # Options: integer >= 1
  gradient_accumulation_steps: 4

  # Optional train-batch cap per epoch for very large sliding-window caches.
  # Options: null for a full train epoch, or positive integer batch cap.
  max_train_batches_per_epoch: 100

  # Compute expensive train metrics every batch.
  # Options: true, false
  compute_train_metrics_every_batch: false

  # Compute train metrics every N batches when compute_train_metrics_every_batch=false.
  # Options: positive integer >= 1
  train_metrics_every_n_batches: 100

  # Compute validation metrics for validation batches.
  # Options: true, false
  compute_val_metrics: true

  # DataLoader worker count for train/val/test loaders.
  # Options: integer >= 0
  num_workers: 2

  # Cap DataLoader workers to SLURM_CPUS_PER_TASK when running in a Slurm job.
  auto_cap_num_workers_to_slurm_cpus: true

  # Use pinned host memory for faster non-blocking CUDA transfers.
  # Options: true, false
  pin_memory: true

  # Keep worker processes alive between epochs.
  # Options: true, false; only used when num_workers > 0
  persistent_workers: true

  # Number of batches prefetched per worker.
  # Options: positive integer; only used when num_workers > 0
  prefetch_factor: 1

  # Let cuDNN benchmark convolution algorithms for fixed patch shapes.
  # Options: true, false
  cudnn_benchmark: true

  # Optionally compile the model with torch.compile.
  # Options: true, false
  torch_compile: false

  # Log batch timing breakdowns to the training log.
  # Options: true, false
  log_timing: true
  timing_log_every_n_batches: 50
  show_progress_bar: true
  progress_log_percent_step: 0

  # Whether to run external test evaluation automatically after training.
  # Options: true, false
  run_external_test_after_training: false

  # Whether to run the configured test split automatically after training.
  # Options: true, false
  run_test_after_training: false

  # Learning-rate scheduler.
  # Supported options:
  # - reduce_on_plateau
  # - plateau
  # - cosine
  # - cosineannealinglr
  # - cosine_annealing
  # - cosine_annealing_lr
  scheduler: reduce_on_plateau

  # ReduceLROnPlateau factor.
  # Options: positive float in (0, 1] typically.
  scheduler_factor: 0.5

  # ReduceLROnPlateau patience in epochs.
  # Options: integer >= 0.
  scheduler_patience: 5

  # Optional training-only keys supported by code even though not set here:
  # - learning_rate: positive float > 0
  # - momentum: positive float, used with SGD
  # - scheduler_min_lr: float >= 0, used with reduce_on_plateau
  # - scheduler_eta_min: float >= 0, used with cosine schedulers
  # - device: auto | cpu | cuda | gpu
  # - seed: integer
  # - eps: float > 0
  # - huber_delta: float > 0
  # - task_type: regression | segmentation | multitask

hparam_tuning:
  # No active architecture-specific tuning target is configured.
  # The previous CAWFE-Latte tuning workflow was removed with the old implementation.
  enabled: false

logging:
  # Logging level.
  # Supported/common options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Log directory.
  # Options: any relative or absolute directory path.
  log_dir: ./artifacts/logs

  # CSV path for epoch-level training metrics.
  # Options: any relative or absolute file path.
  training_log_path: ./artifacts/logs/training_log.csv
