base_config: cawfe_latte_baseline.yaml

experiment:
  name: cawfe_latte_ablation_GAK_resblocks_no_terrain

model:
  architecture: cawfe_latte

cawfe_latte:
  ablation:
    name: GAK_resblocks_no_terrain
  post_fusion_backbone:
    type: residual_spatiotemporal
    num_blocks: 6
  temporal_pooling:
    type: baseline
  decoder:
    type: separate_regression
  terrain_film:
    enabled: false

training:
  output:
    root_dir: artifacts/ablations/cawfe_latte/GAK_resblocks_no_terrain
