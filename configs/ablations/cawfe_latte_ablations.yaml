ablations:
  baseline:
    name: baseline
    description: Preserve the successful CAWFE-Latte architecture unchanged.
    config_path: configs/ablations/cawfe_latte_baseline.yaml
    changed_component: none
  A_resblocks:
    name: A_resblocks
    description: Replace the baseline post-fusion CNN with six residual spatiotemporal blocks.
    config_path: configs/ablations/cawfe_latte_A_resblocks.yaml
    changed_component: post_fusion_backbone
  B_multiscale_context:
    name: B_multiscale_context
    description: Replace the baseline post-fusion CNN with residual multi-scale spatial context.
    config_path: configs/ablations/cawfe_latte_B_multiscale_context.yaml
    changed_component: post_fusion_backbone
  C_temporal_attention:
    name: C_temporal_attention
    description: Replace baseline last-timestep pooling with learned pixelwise temporal attention.
    config_path: configs/ablations/cawfe_latte_C_temporal_attention.yaml
    changed_component: temporal_pooling
  G_separate_regression_decoder:
    name: G_separate_regression_decoder
    description: Replace the shared decoder with separate mask and continuous-regression decoders.
    config_path: configs/ablations/cawfe_latte_G_separate_regression_decoder.yaml
    changed_component: decoder
  I_patch_fire_classifier:
    name: I_patch_fire_classifier
    description: Add a supervision-only patch-level future-fire presence classifier.
    config_path: configs/ablations/cawfe_latte_I_patch_fire_classifier.yaml
    changed_component: patch_fire_head
  K_no_terrain_film:
    name: K_no_terrain_film
    description: Disable terrain encoding and FiLM modulation while retaining terrain data delivery.
    config_path: configs/ablations/cawfe_latte_K_no_terrain_film.yaml
    changed_component: terrain_film
  L_simple_concat_fusion:
    name: L_simple_concat_fusion
    description: Replace fire-query attention with aligned modality concatenation and 1x1 projection.
    config_path: configs/ablations/cawfe_latte_L_simple_concat_fusion.yaml
    changed_component: fusion
  D_local_window_attention:
    name: D_local_window_attention
    description: Replace the baseline post-fusion CNN with per-timestep local-window spatial self-attention.
    config_path: configs/ablations/cawfe_latte_D_local_window_attention.yaml
    changed_component: post_fusion_backbone
    expected_compute_class: medium
  E_earthformer_lite:
    name: E_earthformer_lite
    description: Replace the baseline post-fusion CNN with alternating local space-time cuboid attention.
    config_path: configs/ablations/cawfe_latte_E_earthformer_lite.yaml
    changed_component: post_fusion_backbone
    expected_compute_class: high
  O_fourier_postfusion:
    name: O_fourier_postfusion
    description: Replace the baseline post-fusion CNN with residual Fourier and local spatial mixing.
    config_path: configs/ablations/cawfe_latte_O_fourier_postfusion.yaml
    changed_component: post_fusion_backbone
    expected_compute_class: medium
  P_mamba_postfusion:
    name: P_mamba_postfusion
    description: Replace the baseline post-fusion CNN with official-Mamba temporal and spatial scans.
    config_path: configs/ablations/cawfe_latte_P_mamba_postfusion.yaml
    changed_component: post_fusion_backbone
    expected_compute_class: high
  CG_separate_decoder_temporal_attention:
    name: CG_separate_decoder_temporal_attention
    short_name: CG
    description: Separate regression decoder plus temporal attention pooling.
    components: [C, G]
    changed_components: [temporal_pooling, decoder]
    config_path: configs/ablations/cawfe_latte_CG_separate_decoder_temporal_attention.yaml
    expected_compute_class: medium
  GA_separate_decoder_resblocks:
    name: GA_separate_decoder_resblocks
    short_name: GA
    description: Separate regression decoder plus six residual spatiotemporal blocks.
    components: [G, A]
    changed_components: [post_fusion_backbone, decoder]
    config_path: configs/ablations/cawfe_latte_GA_separate_decoder_resblocks.yaml
    expected_compute_class: medium
  GE_separate_decoder_earthformer:
    name: GE_separate_decoder_earthformer
    short_name: GE
    description: Separate regression decoder plus Earthformer-lite cuboid attention.
    components: [G, E]
    changed_components: [post_fusion_backbone, decoder]
    config_path: configs/ablations/cawfe_latte_GE_separate_decoder_earthformer.yaml
    expected_compute_class: high
  GP_separate_decoder_mamba:
    name: GP_separate_decoder_mamba
    short_name: GP
    description: Separate regression decoder plus official-Mamba spatiotemporal processing.
    components: [G, P]
    changed_components: [post_fusion_backbone, decoder]
    config_path: configs/ablations/cawfe_latte_GP_separate_decoder_mamba.yaml
    expected_compute_class: high
  GK_separate_decoder_no_terrain:
    name: GK_separate_decoder_no_terrain
    short_name: GK
    description: Separate regression decoder with terrain FiLM disabled.
    components: [G, K]
    changed_components: [decoder, terrain_film]
    config_path: configs/ablations/cawfe_latte_GK_separate_decoder_no_terrain.yaml
    expected_compute_class: medium
  CGA_separate_decoder_temporal_attention_resblocks:
    name: CGA_separate_decoder_temporal_attention_resblocks
    short_name: CGA
    description: Separate regression decoder, temporal attention pooling, and six residual spatiotemporal blocks.
    components: [C, G, A]
    changed_components: [post_fusion_backbone, temporal_pooling, decoder]
    config_path: configs/ablations/cawfe_latte_CGA_separate_decoder_temporal_attention_resblocks.yaml
    expected_compute_class: high
  CGE_separate_decoder_temporal_attention_earthformer:
    name: CGE_separate_decoder_temporal_attention_earthformer
    short_name: CGE
    description: Separate regression decoder, temporal attention pooling, and Earthformer-lite cuboid attention.
    components: [C, G, E]
    changed_components: [post_fusion_backbone, temporal_pooling, decoder]
    config_path: configs/ablations/cawfe_latte_CGE_separate_decoder_temporal_attention_earthformer.yaml
    expected_compute_class: high
  CGP_separate_decoder_temporal_attention_mamba:
    name: CGP_separate_decoder_temporal_attention_mamba
    short_name: CGP
    description: Separate regression decoder, temporal attention pooling, and official-Mamba spatiotemporal processing.
    components: [C, G, P]
    changed_components: [post_fusion_backbone, temporal_pooling, decoder]
    config_path: configs/ablations/cawfe_latte_CGP_separate_decoder_temporal_attention_mamba.yaml
    expected_compute_class: high
  CGK_separate_decoder_temporal_attention_no_terrain:
    name: CGK_separate_decoder_temporal_attention_no_terrain
    short_name: CGK
    description: Separate regression decoder and temporal attention pooling with terrain FiLM disabled.
    components: [C, G, K]
    changed_components: [temporal_pooling, decoder, terrain_film]
    config_path: configs/ablations/cawfe_latte_CGK_separate_decoder_temporal_attention_no_terrain.yaml
    expected_compute_class: medium
  GA_Q1_fire_domain_adversarial:
    name: GA_Q1_fire_domain_adversarial
    short_name: GA-Q1
    description: Add training-only fire-domain adversarial invariance to GA.
    components: [G, A, Q1]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, domain_adversarial]
    config_path: configs/ablations/cawfe_latte_GA_Q1_fire_domain_adversarial.yaml
    expected_compute_class: medium
  GA_Q2_fire_domain_mmd:
    name: GA_Q2_fire_domain_mmd
    short_name: GA-Q2
    description: Add cross-fire latent MMD alignment to GA.
    components: [G, A, Q2]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, fire_mmd]
    config_path: configs/ablations/cawfe_latte_GA_Q2_fire_domain_mmd.yaml
    expected_compute_class: medium
  GA_R_mask_guided_regression_attention:
    name: GA_R_mask_guided_regression_attention
    short_name: GA-R
    description: Add zero-initialized mask-guided regression feature attention to GA.
    components: [G, A, R]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, mask_guided_regression]
    config_path: configs/ablations/cawfe_latte_GA_R_mask_guided_regression_attention.yaml
    expected_compute_class: medium
  GA_S_regression_moe:
    name: GA_S_regression_moe
    short_name: GA-S
    description: Replace GA's regression decoder with three softly routed shallow experts.
    components: [G, A, S]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, regression_moe]
    config_path: configs/ablations/cawfe_latte_GA_S_regression_moe.yaml
    expected_compute_class: medium
  GA_T_supervised_contrastive:
    name: GA_T_supervised_contrastive
    short_name: GA-T
    description: Add target-activity supervised contrastive regularization to GA.
    components: [G, A, T]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, supervised_contrastive]
    config_path: configs/ablations/cawfe_latte_GA_T_supervised_contrastive.yaml
    expected_compute_class: medium
  GA_U_physical_state_aux:
    name: GA_U_physical_state_aux
    short_name: GA-U
    description: Add auxiliary global physical-state supervision to GA.
    components: [G, A, U]
    parent_architecture: GA_separate_decoder_resblocks
    changed_components: [post_fusion_backbone, decoder, physical_state_aux]
    config_path: configs/ablations/cawfe_latte_GA_U_physical_state_aux.yaml
    expected_compute_class: medium
  GPK_mamba_no_terrain:
    name: GPK_mamba_no_terrain
    short_name: GPK
    description: Combine separate regression decoding, official Mamba, and disabled terrain FiLM.
    components: [G, P, K]
    parent_architecture: [GP_separate_decoder_mamba, GK_separate_decoder_no_terrain]
    changed_components: [post_fusion_backbone, decoder, terrain_film]
    config_path: configs/ablations/cawfe_latte_GPK_mamba_no_terrain.yaml
    expected_compute_class: high
  CGPK_temporal_mamba_no_terrain:
    name: CGPK_temporal_mamba_no_terrain
    short_name: CGPK
    description: Combine temporal attention, separate decoding, official Mamba, and disabled terrain FiLM.
    components: [C, G, P, K]
    parent_architecture: [CGP_separate_decoder_temporal_attention_mamba, GK_separate_decoder_no_terrain]
    changed_components: [post_fusion_backbone, temporal_pooling, decoder, terrain_film]
    config_path: configs/ablations/cawfe_latte_CGPK_temporal_mamba_no_terrain.yaml
    expected_compute_class: high
  GAK_resblocks_no_terrain:
    name: GAK_resblocks_no_terrain
    short_name: GAK
    description: Combine six residual post-fusion blocks, separate decoding, and disabled terrain FiLM.
    components: [G, A, K]
    parent_architecture: [GA_separate_decoder_resblocks, GK_separate_decoder_no_terrain]
    changed_components: [post_fusion_backbone, decoder, terrain_film]
    config_path: configs/ablations/cawfe_latte_GAK_resblocks_no_terrain.yaml
    expected_compute_class: medium
  CGP_R_mask_guided_regression_attention:
    name: CGP_R_mask_guided_regression_attention
    short_name: CGP-R
    description: Add zero-initialized mask-guided regression feature attention to CGP.
    components: [C, G, P, R]
    parent_architecture: CGP_separate_decoder_temporal_attention_mamba
    changed_components: [post_fusion_backbone, temporal_pooling, decoder, mask_guided_regression]
    config_path: configs/ablations/cawfe_latte_CGP_R_mask_guided_regression_attention.yaml
    expected_compute_class: high
  GP_R_mask_guided_regression_attention:
    name: GP_R_mask_guided_regression_attention
    short_name: GP-R
    description: Add zero-initialized mask-guided regression feature attention to GP.
    components: [G, P, R]
    parent_architecture: GP_separate_decoder_mamba
    changed_components: [post_fusion_backbone, decoder, mask_guided_regression]
    config_path: configs/ablations/cawfe_latte_GP_R_mask_guided_regression_attention.yaml
    expected_compute_class: high
  GK_R_mask_guided_regression_attention:
    name: GK_R_mask_guided_regression_attention
    short_name: GK-R
    description: Add zero-initialized mask-guided regression feature attention to GK.
    components: [G, K, R]
    parent_architecture: GK_separate_decoder_no_terrain
    changed_components: [decoder, terrain_film, mask_guided_regression]
    config_path: configs/ablations/cawfe_latte_GK_R_mask_guided_regression_attention.yaml
    expected_compute_class: medium
