base_config: cawfe_latte_baseline.yaml

experiment:
  name: cawfe_latte_ablation_GA_Q1_fire_domain_adversarial

model:
  architecture: cawfe_latte

cawfe_latte:
  ablation:
    name: GA_Q1_fire_domain_adversarial
  post_fusion_backbone:
    type: residual_spatiotemporal
    num_blocks: 6
  decoder:
    type: separate_regression
  domain_adversarial:
    enabled: true
    lambda_grl: 1.0
    loss_weight: 0.05
    hidden_dim: 64
    dropout: 0.1
    num_domains: 22

training:
  output:
    root_dir: artifacts/ablations/cawfe_latte/GA_Q1_fire_domain_adversarial
