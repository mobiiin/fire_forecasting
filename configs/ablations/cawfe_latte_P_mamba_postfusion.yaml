base_config: cawfe_latte_baseline.yaml

experiment:
  name: cawfe_latte_ablation_P_mamba_postfusion

cawfe_latte:
  ablation:
    name: P_mamba_postfusion
  post_fusion_backbone:
    type: spatiotemporal_mamba
    dim: 64
    num_blocks: 2
    expansion: 2
    dropout: 0.1
    scan_order: temporal_then_spatial
    backend: mamba_ssm

training:
  output:
    root_dir: artifacts/ablations/cawfe_latte/P_mamba_postfusion
