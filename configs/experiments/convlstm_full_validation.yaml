base_config: ../default.yaml

experiment:
  name: convlstm_full_validation
  description: ConvLSTM run that evaluates the full validation loader every epoch.

paths:
  patch_cache_root: ${paths.scratch_root}/fire_forecasting_patch_cache/convlstm_full_validation
  artifacts_root: artifacts/experiments/convlstm_full_validation
  runs_root: ${paths.artifacts_root}/runs
  results_root: ${paths.artifacts_root}/results
  logs_root: ${paths.artifacts_root}/logs

cache:
  cache_dir: ${paths.patch_cache_root}
  cache_version: v5_manual_trim_T5_H10_stride60_convlstm_full_validation

normalization:
  output_dir: ${paths.patch_cache_root}
  path: ${paths.patch_cache_root}/normalization_stats.json
  stats_path: ${paths.patch_cache_root}/normalization_stats.json
  npz_path: ${paths.patch_cache_root}/normalization_stats.npz

training:
  validation:
    mode: full_every_epoch
    max_val_batches_per_epoch: null
    use_same_metric_for_checkpointing: true
  output:
    root_dir: ${paths.runs_root}
    checkpoint_root: ${paths.artifacts_root}/checkpoints
    log_root: ${paths.logs_root}
